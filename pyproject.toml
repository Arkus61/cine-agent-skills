[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cine-agent-skills"
version = "0.3.0"
description = "Portable film-production Agent Skills and validation tooling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]
keywords = ["film", "screenwriting", "agent-skills", "creative-production", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/Arkus61/cine-agent-skills"
Repository = "https://github.com/Arkus61/cine-agent-skills"
Issues = "https://github.com/Arkus61/cine-agent-skills/issues"
Changelog = "https://github.com/Arkus61/cine-agent-skills/blob/main/CHANGELOG.md"

[project.scripts]
cine-skills = "cine_skills.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "networkx>=3.6,<4",
    "diskcache>=5.6,<6",
    "jsonpatch>=1.33,<2",
]
runtime = [
    "networkx>=3.6,<4",
    "diskcache>=5.6,<6",
    "jsonpatch>=1.33,<2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "mcp==2.2.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
